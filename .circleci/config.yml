version: 2.1
orbs:
  helm: circleci/helm@2.0.1
  jq: circleci/jq@2.2.0
#  codecov: codecov/codecov@3.2.4
commands:
  install_pnpm:
    steps:
      - run:
          name: "Install pnpm"
          command: |
            PNPM_SPEC=$(node -p 'require(process.argv[1]).packageManager' "$(git rev-parse --show-toplevel)/package.json")
            cd /tmp && sudo npm install -g --no-update-notifier "$PNPM_SPEC"

executors:
  node_postgres:
    docker:
      - image: cimg/node:26.13.0
      - image: cimg/postgres:15.3
        environment:
          POSTGRES_USER: root
          POSTGRES_DB: circle_test
          POSTGRES_PASSWORD: ""

jobs:
  code_style:
    docker:
      - image: cimg/node:26.13.0
    steps:
      - checkout
      - install_pnpm
      - run:
          name: "Install dependencies"
          command: pnpm install --frozen-lockfile
      - run:
          name: "Check code style"
          command: "bin/check-code-style.sh"
      - run:
          name: "Lint"
          command: "bin/lint.sh"
      - run:
          name: "Frontend unit tests"
          command: "pnpm --filter frontend run test"
      - helm/install-helm-client:
          version: v3.4.2
      - run:
          name: "Helm"
          command: "bin/helm.sh"

  build_frontend:
    docker:
      - image: cimg/gcp:2024.08
    working_directory: /mnt/ramdisk
    steps:
      - checkout
      - setup_remote_docker:
          version: default
          docker_layer_caching: true
      - restore_cache:
          keys:
            - frontend-cache-{{ checksum "pnpm-lock.yaml" }}
            - frontend-cache-
      - run:
          name: Install Docker Buildx
          command: |
            mkdir -vp ~/.docker/cli-plugins/
            curl --silent -L "https://github.com/docker/buildx/releases/download/v0.10.5/buildx-v0.10.5.linux-amd64" > ~/.docker/cli-plugins/docker-buildx
            chmod a+x ~/.docker/cli-plugins/docker-buildx
            docker buildx version
            export DOCKER_BUILDKIT=1
            docker buildx create --name buildx-frontend --use
            docker buildx install
      - run:
          name: "Build frontend image"
          command: "bin/build-docker-frontend.sh"
      - save_cache:
          key: frontend-cache-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - /mnt/ramdisk/frontend/.next/cache
      - when:
          condition:
            or:
              - equal: [master, << pipeline.git.branch >>]
              - equal: [staging, << pipeline.git.branch >>]
          steps:
            - run:
                name: "Push image"
                command: "bin/push-docker-frontend-image.sh"
    resource_class: large

  prepare_backend_test:
    executor: node_postgres
    working_directory: /mnt/ramdisk/backend
    steps:
      - checkout:
          path: /mnt/ramdisk
      - jq/install
      - install_pnpm
      - restore_cache:
          keys:
            - backend-pnpm-store-{{ checksum "/mnt/ramdisk/pnpm-lock.yaml" }}
      - run:
          name: "Install dependencies"
          command: |
            pnpm config set store-dir /mnt/ramdisk/.pnpm-store
            pnpm install --frozen-lockfile --filter backend
      - run:
          name: "Set environment"
          command: |
            cp .env.example .env
      - run:
          name: "Set up Prisma"
          command: |
            pnpm run generate
      - save_cache:
          key: backend-pnpm-store-{{ checksum "/mnt/ramdisk/pnpm-lock.yaml" }}
          paths:
            - /mnt/ramdisk/.pnpm-store
      - run:
          name: "Delete pnpm store from workspace"
          command: "rm -rf /mnt/ramdisk/.pnpm-store"
      - persist_to_workspace:
          root: /mnt/ramdisk
          paths:
            - backend
            - node_modules
    resource_class: large

  test_backend:
    executor: node_postgres
    environment:
      DATABASE_URL: postgres://root@localhost:5432/circle_test
      RUNNING_IN_CI: "true"
      NODE_ENV: test
    parallelism: 8
    working_directory: /mnt/ramdisk/backend
    steps:
      - attach_workspace:
          at: /mnt/ramdisk
      - run:
          name: "Wait for database"
          command: dockerize -wait tcp://localhost:5432 -timeout 1m
      - run:
          name: "Create extensions"
          command: |
            psql -d circle_test -U root -p 5432 -h localhost -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\"; CREATE EXTENSION IF NOT EXISTS \"pg_trgm\"; CREATE EXTENSION IF NOT EXISTS \"btree_gin\";"
      - run:
          name: "Run tests"
          command: |
            export NODE_OPTIONS="--max-old-space-size=8192 --experimental-vm-modules"
            TEST=$(circleci tests glob ./**/*.test.ts | grep -v node_modules | circleci tests split --split-by=timings)
            echo $TEST
            # Not `pnpm exec`: the workspace root isn't attached, so pnpm would reinstall backend
            # standalone, skipping the build-script allowlist and leaving node-rdkafka unbuilt.
            node_modules/.bin/jest --ci --runInBand --coverage --runTestsByPath $TEST
      - run:
          name: "Process test reports"
          command: |
            if [ -e ./coverage/jest/clover.xml ]; then
              sed -i "s|`pwd`/||g" ./coverage/jest/clover.xml
            fi
            if [ -e ./coverage/jest/coverage-final.json ]; then
              sed -i "s|`pwd`/||g" ./coverage/jest/coverage-final.json
            fi
      - store_test_results:
          path: ./coverage/junit/
      - store_artifacts:
          path: ./coverage/junit/
      - store_artifacts:
          path: ./coverage/jest
          destination: backend-tests
      # - persist_to_workspace:
      #     root: ~/project/backend
      #     paths:
      #       - coverage
      - run:
          name: "Upload coverage"
          command: |
            curl https://uploader.codecov.io/latest/linux/codecov -o /tmp/codecov
            chmod +x /tmp/codecov
            /tmp/codecov -F backend -n "${CIRCLE_BUILD_NUM}"
    ### when codecov orb is enabled
    #    - codecov/upload:
    #        flags: backend
    # The resource_class feature allows configuring CPU and RAM resources for each job. Different resource classes are available for different executors. https://circleci.com/docs/2.0/configuration-reference/#resourceclass
    resource_class: large
  # could combine the artifacts in this step if needed, now the codecov/junit stuff combines automatically
